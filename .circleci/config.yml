            JEST_JUNIT_OUTPUT_NAME=freelancer-backend-junit.xml \
            npm run test:freelancer -- --coverage --coverageReporters=json-summary --coverageReporters=text --coverageReporters=lcov --reporters=default --reporters=jest-junit
      - run:
          name: Enforce backend Freelancer coverage thresholds
          command: |
            node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('Missing '+p); process.exit(1);} const summary=JSON.parse(fs.readFileSync(p,'utf8')); const t=summary.total||{}; const req={lines:40,functions:40,branches:25,statements:40}; const bad=Object.entries(req).filter(([k,v])=>!t[k] || Number(t[k].pct||0)<v); if(bad.length){console.error('Coverage thresholds failed:', bad.map(([k,v])=>k+':'+(t[k]?t[k].pct:0)+'<'+v).join(', ')); process.exit(1);} console.log('Coverage thresholds passed.');"
      - save_cache:
          key: backend-npm-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: coverage

