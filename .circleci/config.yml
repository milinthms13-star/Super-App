  frontend_danceduet_tests:
    docker:
      - image: cimg/node:20.12
    working_directory: ~/repo
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-npm-v2-{{ checksum "package-lock.json" }}
            - frontend-npm-v2-
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Run DanceDuet frontend tests with JUnit and coverage
          command: |
            mkdir -p test-results coverage
            JEST_JUNIT_OUTPUT_DIR=./test-results \
            JEST_JUNIT_OUTPUT_NAME=danceduet-frontend-junit.xml \
            npm test -- --watchAll=false --runInBand --testPathPattern=src/modules/danceduet/danceDuetUpgradeUtils.test.js --coverage --collectCoverageFrom='src/modules/danceduet/danceDuetUpgradeUtils.js' --coverageReporters=json-summary --coverageReporters=text --coverageReporters=lcov --reporters=default --reporters=jest-junit
      - run:
          name: Enforce frontend DanceDuet coverage thresholds
          command: |
            node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('Missing '+p); process.exit(1);} const summary=JSON.parse(fs.readFileSync(p,'utf8')); const t=summary.total||{}; const req={lines:50,functions:50,branches:40,statements:50}; const bad=Object.entries(req).filter(([k,v])=>!t[k] || Number(t[k].pct||0)<v); if(bad.length){console.error('Coverage thresholds failed:', bad.map(([k,v])=>k+':'+(t[k]?t[k].pct:0)+'<'+v).join(', ')); process.exit(1);} console.log('Coverage thresholds passed.');"
      - save_cache:
