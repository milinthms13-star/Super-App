      - image: cimg/node:20.12-browsers
    working_directory: ~/repo
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-npm-v2-{{ checksum "package-lock.json" }}
            - frontend-npm-v2-
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Run DanceDuet Cypress E2E smoke flow
          command: |
            mkdir -p test-results
            npm start > /tmp/frontend.log 2>&1 &
            npx wait-on http://localhost:3000
            npx cypress run --spec cypress/e2e/danceduet-go-live.cy.js --browser chrome
      - save_cache:
          key: frontend-npm-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - store_artifacts:
          path: /tmp/frontend.log

  beautyai_main_gate:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Main branch quality gate summary
          command: echo "BeautyAI + BusinessServices backend and frontend quality gates passed on main."

  danceduet_main_gate:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Main branch DanceDuet quality gate summary
          command: echo "DanceDuet backend and frontend quality gates passed on main."

workflows:
  beautyai_quality_gates:
    jobs:
      - backend_beautyai_tests:
          filters:
            branches:
              ignore:
                - gh-pages
      - frontend_beautyai_tests:
          filters:
            branches:
              ignore:
                - gh-pages
      - backend_businessservices_tests:
          filters:
            branches:
              ignore:
                - gh-pages
      - frontend_businessservices_tests:
          filters:
            branches:
              ignore:
                - gh-pages
      - beautyai_main_gate:
          requires:
            - backend_beautyai_tests
            - frontend_beautyai_tests
            - backend_businessservices_tests
            - frontend_businessservices_tests
          filters:
            branches:
              only:
                - main

  danceduet_quality_gates:
    jobs:
      - backend_danceduet_tests:
          filters:
            branches:
              ignore:
                - gh-pages
      - frontend_danceduet_tests:
          filters:
            branches:
              ignore:
                - gh-pages
      - frontend_danceduet_e2e:
          filters:
            branches:
              ignore:
                - gh-pages
      - danceduet_main_gate:
          requires:
            - backend_danceduet_tests
            - frontend_danceduet_tests
            - frontend_danceduet_e2e
          filters:
            branches:
              only:
                - main
