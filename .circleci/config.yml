  frontend_gulfservices_e2e:
    docker:
      - image: cimg/node:20.12-browsers
    working_directory: ~/repo
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-npm-v2-{{ checksum "package-lock.json" }}
            - frontend-npm-v2-
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Run GulfServices Cypress E2E smoke flow
          command: |
            mkdir -p test-results
            npm start > /tmp/frontend.log 2>&1 &
            npx wait-on http://localhost:3000
            npx cypress run --spec cypress/e2e/gulfservices-go-live.cy.js --browser chrome
      - save_cache:
          key: frontend-npm-v2-{{ checksum "package-lock.json" }}
          paths:
