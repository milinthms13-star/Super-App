            JEST_JUNIT_OUTPUT_NAME=danceduet-backend-junit.xml \
            npx jest --watchAll=false --runInBand --testPathPattern=tests/danceDuet.routes.integration.test.js --coverage --collectCoverageFrom='routes/danceDuet.js' --collectCoverageFrom='services/danceDuetService.js' --collectCoverageFrom='models/DanceDuetJob.js' --coverageReporters=json-summary --coverageReporters=text --coverageReporters=lcov --reporters=default --reporters=jest-junit
      - run:
          name: Enforce backend DanceDuet coverage thresholds
          command: |
            node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('Missing '+p); process.exit(1);} const summary=JSON.parse(fs.readFileSync(p,'utf8')); const t=summary.total||{}; const req={lines:25,functions:25,branches:15,statements:25}; const bad=Object.entries(req).filter(([k,v])=>!t[k] || Number(t[k].pct||0)<v); if(bad.length){console.error('Coverage thresholds failed:', bad.map(([k,v])=>k+':'+(t[k]?t[k].pct:0)+'<'+v).join(', ')); process.exit(1);} console.log('Coverage thresholds passed.');"
