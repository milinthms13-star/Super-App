version: 2.1

jobs:
  backend_beautyai_tests:
    docker:
      - image: cimg/node:20.12
    working_directory: ~/repo/backend
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - backend-npm-v2-{{ checksum "package-lock.json" }}
            - backend-npm-v2-
      - run:
          name: Install backend dependencies
          command: npm ci
      - run:
          name: Run BeautyAI backend integration tests with JUnit and coverage
          command: |
            mkdir -p test-results coverage
            JEST_JUNIT_OUTPUT_DIR=./test-results \
            JEST_JUNIT_OUTPUT_NAME=beautyai-backend-junit.xml \
            npx jest --config jest.beautyai.config.js --watchAll=false --runInBand --coverage --reporters=default --reporters=jest-junit
      - run:
          name: Enforce backend BeautyAI coverage thresholds
          command: |
            node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('Missing '+p); process.exit(1);} const summary=JSON.parse(fs.readFileSync(p,'utf8')); const t=summary.total||{}; const req={lines:10,functions:10,branches:5,statements:10}; const bad=Object.entries(req).filter(([k,v])=>!t[k] || Number(t[k].pct||0)<v); if(bad.length){console.error('Coverage thresholds failed:', bad.map(([k,v])=>k+':'+(t[k]?t[k].pct:0)+'<'+v).join(', ')); process.exit(1);} console.log('Coverage thresholds passed.');"
      - save_cache:
          key: backend-npm-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: coverage

  frontend_beautyai_tests:
    docker:
      - image: cimg/node:20.12
    working_directory: ~/repo
    environment:
      CI: "true"
    steps:
      - checkout
      - restore_cache:
          keys:
            - frontend-npm-v2-{{ checksum "package-lock.json" }}
            - frontend-npm-v2-
      - run:
          name: Install frontend dependencies
          command: npm ci
      - run:
          name: Run BeautyAI frontend tests with JUnit and coverage
          command: |
            mkdir -p test-results coverage
            JEST_JUNIT_OUTPUT_DIR=./test-results \
            JEST_JUNIT_OUTPUT_NAME=beautyai-frontend-junit.xml \
            npm test -- --watchAll=false --runInBand --testPathPattern=src/modules/beautyai --coverage --collectCoverageFrom='src/modules/beautyai/**/*.{js,jsx}' --coverageReporters=json-summary --coverageReporters=text --coverageReporters=lcov --reporters=default --reporters=jest-junit
      - run:
          name: Enforce frontend BeautyAI coverage thresholds
          command: |
            node -e "const fs=require('fs'); const p='coverage/coverage-summary.json'; if(!fs.existsSync(p)){console.error('Missing '+p); process.exit(1);} const summary=JSON.parse(fs.readFileSync(p,'utf8')); const t=summary.total||{}; const req={lines:10,functions:10,branches:5,statements:10}; const bad=Object.entries(req).filter(([k,v])=>!t[k] || Number(t[k].pct||0)<v); if(bad.length){console.error('Coverage thresholds failed:', bad.map(([k,v])=>k+':'+(t[k]?t[k].pct:0)+'<'+v).join(', ')); process.exit(1);} console.log('Coverage thresholds passed.');"
      - save_cache:
          key: frontend-npm-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
      - store_artifacts:
          path: coverage

